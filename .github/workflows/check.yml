name: Check Scripts

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  correctly-generated:
    name: "are correctly generated"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
    - run: pip install nox!=2025.5.1

    - run: nox -s generate
    - name: Check regenerated scripts vs what is generated by automation.
      run: git diff --exit-code

  work-as-advertised:
    name: "work as advertised (${{ matrix.os }})"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
    - run: pip install nox!=2025.5.1

    # Install supported Python versions. Keep in sync with noxfile.py as
    # much as possible, however, GitHub Actions eventually drops support
    # for EOL Python versions, at which point we can't test them in CI.
    - uses: actions/setup-python@v5
      if: matrix.os == 'macos-15-intel'
      with:
        python-version: "3.6"
    - uses: actions/setup-python@v5
      if: matrix.os == 'macos-15-intel'
      with:
        python-version: "3.7"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.8"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.15"

    # Check that the scripts work.
    - run: nox -s check --no-error-on-missing-interpreters -db venv

  all-checks:
    name: work as advertised
    needs: [correctly-generated, work-as-advertised]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: |
        test "${{ needs.correctly-generated.result }}" = success
        test "${{ needs.work-as-advertised.result }}" = success
